services:
  - type: web
    name: railpulse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LIVE_UPDATE_INTERVAL_SECONDS
        value: 15
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://railpulse-wine.vercel.app,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - key: RAILRADAR_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
